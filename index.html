<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初恋资源库</title>
  <meta name="description" content="初恋资源库 —— 一个轻量静态资料库,通过 GitHub + Cloudflare Pages 部署。" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">初恋资源库</a>
      <nav class="nav-cats" id="nav-cats"><!-- 顶部多分类导航:首页 + 各分类,由 app.js 从数据生成 --></nav>
      <button class="login-btn" type="button">登录</button>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <input id="search" type="search" placeholder="搜索资料(标题/关键词/标签)..." aria-label="搜索" />
      <select id="filter-category" aria-label="按分类筛选"></select>
    </section>

    <div class="section-title" id="section-title">最新资源</div>

    <!-- 主列表:封面在上网格卡片 -->
    <section id="catalog" class="catalog" aria-live="polite">
      <p class="muted">正在加载资料列表...</p>
    </section>

    <nav id="pager" class="pager" aria-label="分页"></nav>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>初恋资源库 · 静态站 · 部署于 Cloudflare Pages</span>
      <span class="muted">数据来源:仓库 <code>data/resources.json</code></span>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
